steps:
  # Étape 1: Construire l'image Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      # - 'gcr.io/$PROJECT_ID/cloud-app:$SHORT_SHA'
      # - '-t'
      - 'gcr.io/$PROJECT_ID/cloud-app:latest'
      - '.'

  # Étape 2: Pusher l'image vers Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/cloud-app:latest'

  # Étape 3: Déployer sur Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cloud-app'
      - '--image=gcr.io/$PROJECT_ID/cloud-app:latest'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'

  # Étape 4: Smoke tests (vérifie que /health répond)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'smoke-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        URL=$(gcloud run services describe cloud-app --region=europe-west1 --format="value(status.url)")
        echo "Health check URL: ${URL}/health"
        curl -f --retry 5 --retry-delay 2 "${URL}/health"

images:
  # - 'gcr.io/$PROJECT_ID/cloud-app:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/cloud-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
#   machineType: 'N1_HIGHCPU_8'

timeout: '1800s'
